# nginx para la SPA de Angular.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas del enrutador de Angular (/dashboard, /deliveries, ...): el
    # servidor no las conoce, asi que devuelve index.html y el router
    # resuelve. Sin esto, recargar en /dashboard da 404 — y el retorno del
    # login de Microsoft aterriza justo en una de esas rutas.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los bundles llevan hash en el nombre: se pueden cachear para siempre.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea: es quien apunta a los bundles nuevos.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
